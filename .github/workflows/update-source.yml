name: Update AltStore source

on:
  schedule:
    # Every 6 hours. GitHub delays scheduled runs under load, so treat the
    # times as approximate.
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - source-config.json
      - build_source.py
      - .github/workflows/update-source.yml

permissions:
  contents: write

concurrency:
  group: update-source
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build apps.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python build_source.py

      - name: Verify Feather can parse it
        run: python feather_check.py apps.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain apps.json)" ]; then
            git add apps.json
            git commit -m "Update apps.json"
            git push
            echo "published an update"
            exit 0
          fi

          echo "apps.json unchanged"

          # GitHub disables scheduled workflows after 60 days without a commit.
          # If upstream goes quiet that long, the automation would switch itself
          # off silently, so leave a heartbeat well before the deadline.
          age_days=$(( ( $(date -u +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "days since last commit: $age_days"
          if [ "$age_days" -ge 25 ]; then
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .last-checked
            git add .last-checked
            git commit -m "Heartbeat: keep scheduled workflow enabled"
            git push
            echo "heartbeat committed"
          fi
