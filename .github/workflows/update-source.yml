name: Update AltStore source

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    paths:
      - source-config.json
      - build_source.py
      - .github/workflows/update-source.yml

permissions:
  contents: write

concurrency:
  group: update-source
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build apps.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python build_source.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain apps.json)" ]; then
            git add apps.json
            git commit -m "Update apps.json"
            git push
          else
            echo "apps.json unchanged"
          fi
